name: Documentation Governance

on:
  push:
    branches:
      - main
      - docs/agent-ready-foundation-v1
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs.py"
      - "tools/lot_eval_rdm.py"
      - ".github/workflows/docs-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Bilingual structure and local links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bilingual documentation
        run: python scripts/check_docs.py
      - name: Execute LOT-EVAL reference model and adversarial mutation harness
        run: python tools/lot_eval_rdm.py
