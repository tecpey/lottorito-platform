name: P-04 Schema Evolution Compatibility
on:
  workflow_dispatch:
  pull_request:
    paths: ["prototypes/p04-schema-evolution/**", "docs/en/engineering/prototypes/p04-schema-evolution.md", "docs/fa/engineering/prototypes/p04-schema-evolution.md", ".github/workflows/p04-schema-evolution.yml"]
  push:
    branches: ["spike/p04-schema-evolution"]
    paths: ["prototypes/p04-schema-evolution/**", ".github/workflows/p04-schema-evolution.yml"]
permissions: {contents: read}
concurrency:
  group: p04-schema-evolution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.7-bookworm
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: p04-admin-only-not-production, POSTGRES_DB: lottorito_p04}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lottorito_p04"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgres://postgres:p04-admin-only-not-production@127.0.0.1:5432/lottorito_p04
      TENANT_A_V1_DATABASE_URL: postgres://p04_tenant_a_v1:p04-tenant-a-v1-not-production@127.0.0.1:5432/lottorito_p04
      TENANT_A_V2_DATABASE_URL: postgres://p04_tenant_a_v2:p04-tenant-a-v2-not-production@127.0.0.1:5432/lottorito_p04
      TENANT_B_V1_DATABASE_URL: postgres://p04_tenant_b_v1:p04-tenant-b-v1-not-production@127.0.0.1:5432/lottorito_p04
      TENANT_B_V2_DATABASE_URL: postgres://p04_tenant_b_v2:p04-tenant-b-v2-not-production@127.0.0.1:5432/lottorito_p04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: prototypes/p04-schema-evolution/package-lock.json
      - run: npm ci
        working-directory: prototypes/p04-schema-evolution
      - run: npm test
        working-directory: prototypes/p04-schema-evolution
