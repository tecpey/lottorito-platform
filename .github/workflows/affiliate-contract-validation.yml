name: Affiliate Contract Validation

on:
  push:
    branches:
      - docs/g09-affiliate-api-wire-contract-v1
    paths:
      - "contracts/openapi/**"
      - "contracts/asyncapi/**"
      - "scripts/validate_affiliate_contract_payloads.mjs"
      - ".redocly.yaml"
      - ".github/workflows/affiliate-contract-validation.yml"
  pull_request:
    branches:
      - docs/affiliate-api-capability-contract-v1
    paths:
      - "contracts/openapi/**"
      - "contracts/asyncapi/**"
      - "scripts/validate_affiliate_contract_payloads.mjs"
      - ".redocly.yaml"
      - ".github/workflows/affiliate-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affiliate-contract-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenAPI, AsyncAPI and payload contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.11.1"
      - name: Install pinned contract validators
        run: |
          npm install --prefix "$RUNNER_TEMP/contract-tools" --no-save --no-audit --no-fund \
            @redocly/cli@2.83.0 \
            @asyncapi/cli@6.2.2 \
            ajv@8.17.1 \
            ajv-formats@3.0.1
          echo "CONTRACT_TOOLS_PREFIX=$RUNNER_TEMP/contract-tools" >> "$GITHUB_ENV"
      - name: Validate OpenAPI contracts
        run: |
          "$RUNNER_TEMP/contract-tools/node_modules/.bin/redocly" --version
          "$RUNNER_TEMP/contract-tools/node_modules/.bin/redocly" check-config --config=.redocly.yaml
          "$RUNNER_TEMP/contract-tools/node_modules/.bin/redocly" lint --config=.redocly.yaml affiliate_management_v1 --format=github-actions
          "$RUNNER_TEMP/contract-tools/node_modules/.bin/redocly" lint --config=.redocly.yaml partner_event_ingestion_v1 --format=github-actions
      - name: Validate AsyncAPI contract
        run: |
          "$RUNNER_TEMP/contract-tools/node_modules/.bin/asyncapi" --version
          "$RUNNER_TEMP/contract-tools/node_modules/.bin/asyncapi" validate --fail-severity=error \
            contracts/asyncapi/affiliate-domain-events.v1.json
      - name: Validate schema payload fixtures
        run: |
          node scripts/validate_affiliate_contract_payloads.mjs
