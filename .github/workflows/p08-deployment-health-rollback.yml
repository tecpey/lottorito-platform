name: P-08 Deployment Health and Rollback

on:
  push:
    branches:
      - spike/p08-deployment-health-rollback
    paths:
      - ".github/workflows/p08-deployment-health-rollback.yml"
      - "prototypes/p08-deployment/**"
      - "docs/en/engineering/prototypes/p08-deployment-health-rollback.md"
      - "docs/fa/engineering/prototypes/p08-deployment-health-rollback.md"
  pull_request:
    paths:
      - ".github/workflows/p08-deployment-health-rollback.yml"
      - "prototypes/p08-deployment/**"
      - "docs/en/engineering/prototypes/p08-deployment-health-rollback.md"
      - "docs/fa/engineering/prototypes/p08-deployment-health-rollback.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p08-deployment-health-rollback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate and compile experiment
        run: python3 -m compileall -q prototypes/p08-deployment
      - name: Build deterministic release artifacts
        run: |
          REVISION="${GITHUB_SHA}"
          python3 prototypes/p08-deployment/build.py v1 --out /tmp/p08-build-a --source-revision "$REVISION"
          python3 prototypes/p08-deployment/build.py v1 --out /tmp/p08-build-b --source-revision "$REVISION"
          cmp /tmp/p08-build-a/affiliate-agent-v1.pyz /tmp/p08-build-b/affiliate-agent-v1.pyz
      - name: Run positive and adversarial deployment tests
        run: python3 -m unittest discover -s prototypes/p08-deployment/tests -v
