name: P-03C/P-03D Ledger and Provider Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prototypes/p03-ledger-outbox-integration/**"
      - "prototypes/p03-provider-ledger-integration/**"
      - "prototypes/p02-ledger-posting/**"
      - "docs/en/engineering/prototypes/p03-ledger-outbox-integration.md"
      - "docs/fa/engineering/prototypes/p03-ledger-outbox-integration.md"
      - "docs/en/engineering/prototypes/p03-provider-ledger-integration.md"
      - "docs/fa/engineering/prototypes/p03-provider-ledger-integration.md"
      - ".github/workflows/p03-ledger-outbox-integration.yml"
      - ".github/workflows/p03-provider-ledger-integration.yml"
  push:
    branches:
      - "spike/p03-ledger-outbox-integration"
      - "spike/p03d-provider-ledger-integration"
    paths:
      - "prototypes/p03-ledger-outbox-integration/**"
      - "prototypes/p03-provider-ledger-integration/**"
      - "prototypes/p02-ledger-posting/**"
      - "docs/en/engineering/prototypes/p03-ledger-outbox-integration.md"
      - "docs/fa/engineering/prototypes/p03-ledger-outbox-integration.md"
      - "docs/en/engineering/prototypes/p03-provider-ledger-integration.md"
      - "docs/fa/engineering/prototypes/p03-provider-ledger-integration.md"
      - ".github/workflows/p03-ledger-outbox-integration.yml"
      - ".github/workflows/p03-provider-ledger-integration.yml"

permissions:
  contents: read

concurrency:
  group: p03-ledger-outbox-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Node.js 26 + PostgreSQL 18.7 ledger/provider integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p03c-admin-only-not-production
          POSTGRES_DB: lottorito_p03c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lottorito_p03c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgres://postgres:p03c-admin-only-not-production@127.0.0.1:5432/lottorito_p03c
      TENANT_A_DATABASE_URL: postgres://tenant_a_ledger_runtime:p02-tenant-a-not-for-production@127.0.0.1:5432/lottorito_p03c
      TENANT_B_DATABASE_URL: postgres://tenant_b_ledger_runtime:p02-tenant-b-not-for-production@127.0.0.1:5432/lottorito_p03c
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install pinned prototype dependency
        working-directory: prototypes/p03-ledger-outbox-integration
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run end-to-end ledger/outbox integration tests
        working-directory: prototypes/p03-ledger-outbox-integration
        run: npm test
      - name: Create isolated P-03D database
        working-directory: prototypes/p03-ledger-outbox-integration
        run: |
          node --input-type=module -e 'import { Client } from "pg"; const c = new Client({ connectionString: process.env.ADMIN_DATABASE_URL.replace("/lottorito_p03c", "/postgres") }); await c.connect(); await c.query("CREATE DATABASE lottorito_p03d"); await c.end();'
      - name: Install pinned P-03D dependency
        working-directory: prototypes/p03-provider-ledger-integration
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run provider inbox to ledger atomic integration tests
        working-directory: prototypes/p03-provider-ledger-integration
        env:
          ADMIN_DATABASE_URL: postgres://postgres:p03c-admin-only-not-production@127.0.0.1:5432/lottorito_p03d
          TENANT_A_AFFILIATE_DATABASE_URL: postgres://tenant_a_ledger_runtime:p02-tenant-a-not-for-production@127.0.0.1:5432/lottorito_p03d
          TENANT_B_AFFILIATE_DATABASE_URL: postgres://tenant_b_ledger_runtime:p02-tenant-b-not-for-production@127.0.0.1:5432/lottorito_p03d
          TENANT_A_LOTTERY_DATABASE_URL: postgres://tenant_a_lottery_runtime:p02-tenant-a-lottery-not-for-production@127.0.0.1:5432/lottorito_p03d
        run: npm test
