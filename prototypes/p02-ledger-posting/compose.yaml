services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p02-admin-only-not-production
      POSTGRES_DB: lottorito_p02
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lottorito_p02"]
      interval: 5s
      timeout: 5s
      retries: 12
