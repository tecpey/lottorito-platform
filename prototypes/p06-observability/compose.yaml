services:
  postgres:
    build:
      context: ../..
      dockerfile: prototypes/p06-observability/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p06-admin-only-not-production
      POSTGRES_DB: lottorito_p06
    volumes:
      - ../../prototypes/p06-observability:/workspace/p06:ro
      - ../../prototypes/p02-ledger-posting:/workspace/p02:ro
      - ../../prototypes/p09-contract-recovery:/workspace/p09:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lottorito_p06"]
      interval: 2s
      timeout: 3s
      retries: 30
